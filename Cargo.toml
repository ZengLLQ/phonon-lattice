[package]
name = "phonon-lattice"
version = "0.1.0"
edition = "2021"
authors = ["ZengLLQ <zengllq@users.noreply.github.com>"]
description = "High-performance crystal lattice dynamics, phonon dispersion, non-analytic corrections, and anharmonic thermal transport in Rust."
license = "MIT"
repository = "https://github.com/ZengLLQ/phonon-lattice"

[lib]
name = "phonon_lattice"
path = "src/lib.rs"

[[bin]]
name = "phonon-lattice"
path = "src/main.rs"

[dependencies]
num-complex = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
